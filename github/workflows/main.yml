name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # 1. بزرگ کردن فضای دیسک (root + /mnt رو ترکیب می‌کنه)
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk
        run: df -h

      # 2. Checkout (بعد از maximize تا روی دیسک بزرگ بیفته)
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          submodules: recursive
          fetch-depth: 1

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK + NDK
      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      # 5. فقط arm64-v8a (هم فضای کمتر هم زمان کمتر)
      - name: Keep only arm64-v8a
        run: |
          grep -rlE "abiFilters|armeabi-v7a" --include=build.gradle --include=*.gradle . | while read f; do
            echo "Patching $f"
            sed -i -E '/abiFilters/ s/abiFilters.*/abiFilters "arm64-v8a"/' "$f"
            sed -i -E '/include +"armeabi-v7a"/ s/include.*/include "arm64-v8a"/' "$f"
          done
          grep -rnE "abiFilters|include +\"arm" --include=*.gradle . || true

      # 6. gradle.properties
      - name: Optimize gradle.properties
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 7. ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # 8. Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle executable
        run: chmod +x gradlew

      # 9. Build
      - name: Build Telegram Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace
        env:
          CC: ccache clang
          CXX: ccache clang++

      - name: Disk usage after build
        if: always()
        run: df -h

      - name: Find APK files
        if: success()
        run: find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
