name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # 1. دانلود سورس از هاست خودت
      - name: Download Telegram Source ZIP
        run: |
          set -e

          echo "Downloading source..."

          wget -O Telegram-master.zip \
            "https://mramirhoseini.ir/Telegram-master.zip"

          echo "=== ZIP SIZE ==="
          ls -lh Telegram-master.zip

          echo "=== Extracting ==="
          unzip -q Telegram-master.zip

          echo "=== Extracted folders ==="
          ls -la

          # انتقال محتویات Telegram-master به workspace
          if [ -d "Telegram-master" ]; then
            shopt -s dotglob
            mv Telegram-master/* .
            rmdir Telegram-master
          fi

          echo "=== SOURCE ROOT ==="
          ls -la

          echo "=== GRADLE CHECK ==="
          test -f gradlew
          echo "gradlew found successfully"

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v4

      # 4. آزاد کردن فضای اضافی
      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get clean

          echo "=== AFTER CLEANUP ==="
          df -h

      # 5. نصب SDK و NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 6. بررسی فضای بعد از NDK
      - name: Check disk after NDK
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== ANDROID SDK SIZE ==="
          du -sh "$ANDROID_HOME" 2>/dev/null || true

          echo "=== NDK SIZE ==="
          du -sh "$ANDROID_HOME/ndk/27.2.12479018" 2>/dev/null || true

      # 7. فقط ARM64
      - name: Keep only arm64-v8a
        run: |
          grep -rlE "abiFilters|armeabi-v7a" \
            --include='build.gradle' \
            --include='*.gradle' \
            . 2>/dev/null |
          while read -r f; do
            echo "Patching: $f"

            sed -i -E \
              '/abiFilters/ s/abiFilters.*/abiFilters "arm64-v8a"/' \
              "$f" || true

            sed -i -E \
              '/include +"armeabi-v7a"/ s/include.*/include "arm64-v8a"/' \
              "$f" || true
          done

      # 8. Gradle تنظیمات
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 9. ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          ccache --max-size=2G

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 10. Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 11. Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 12. فضای قبل از Build
      - name: Check disk before build
        run: |
          echo "=== DISK BEFORE BUILD ==="
          df -h

          echo "=== GRADLE ==="
          du -sh ~/.gradle 2>/dev/null || true

          echo "=== CCACHE ==="
          du -sh ~/.ccache 2>/dev/null || true

      # 13. Gradle executable
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 14. Build
      - name: Build Telegram Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 15. پیدا کردن APK
      - name: Find APK
        if: success()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -exec ls -lh {} \;

      # 16. آپلود APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 17. فضای نهایی
      - name: Final disk usage
        if: always()
        run: |
          echo "=== FINAL DISK ==="
          df -h
