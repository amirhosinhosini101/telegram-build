name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: write

    steps:

      # 1. دریافت ریپازیتوری خودت
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v4

      # 4. آزاد کردن فضای اضافی
      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get clean

          echo "=== AFTER CLEANUP ==="
          df -h

      # 5. دانلود ZIP خارج از Workspace
      - name: Download Telegram Source ZIP
        run: |
          set -e

          echo "=== Downloading Telegram source ==="

          wget -O /tmp/Telegram-master.zip \
            "https://mramirhoseini.ir/Telegram-master.zip"

          echo "=== DOWNLOADED FILE ==="
          ls -lh /tmp/Telegram-master.zip

          echo "=== FILE TYPE ==="
          file /tmp/Telegram-master.zip

      # 6. پاک کردن سورس قبلی ریپو
      - name: Prepare Repository
        run: |
          set -e

          echo "=== Cleaning old repository files ==="

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "=== Repository after cleanup ==="
          ls -la

      # 7. استخراج ZIP
      - name: Extract Telegram Source
        run: |
          set -e

          echo "=== Extracting Telegram source ==="

          unzip -q /tmp/Telegram-master.zip

          echo "=== After extraction ==="
          ls -la

          # اگر ZIP شامل Telegram-master باشد
          if [ -d "Telegram-master" ]; then
            echo "Telegram-master directory found."

            shopt -s dotglob
            cp -a Telegram-master/. .
            rm -rf Telegram-master
          fi

          echo "=== FINAL SOURCE ROOT ==="
          ls -la

      # 8. بررسی سورس
      - name: Verify Telegram Source
        run: |
          set -e

          echo "================================"
          echo "VERIFYING TELEGRAM SOURCE"
          echo "================================"

          echo
          echo "Checking gradlew..."

          test -f gradlew || {
            echo "ERROR: gradlew not found!"
            exit 1
          }

          echo
          echo "Checking settings.gradle..."

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found!"
            exit 1
          }

          echo
          echo "Checking core_settings.gradle..."

          if [ ! -f "TMessagesProj_Modules/media/core_settings.gradle" ]; then
            echo "ERROR: core_settings.gradle NOT FOUND!"
            echo
            echo "=== TMessagesProj_Modules structure ==="
            find TMessagesProj_Modules -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo
          echo "================================"
          echo "SOURCE IS COMPLETE"
          echo "================================"

      # 9. حذف ZIP موقت
      - name: Remove Temporary ZIP
        run: |
          rm -f /tmp/Telegram-master.zip

      # 10. فقط ARM64
      - name: Keep only arm64-v8a
        run: |
          grep -rlE "abiFilters|armeabi-v7a" \
            --include='build.gradle' \
            --include='*.gradle' \
            . 2>/dev/null |
          while read -r f; do
            echo "Patching: $f"

            sed -i -E \
              '/abiFilters/ s/abiFilters.*/abiFilters "arm64-v8a"/' \
              "$f" || true

            sed -i -E \
              '/include +"armeabi-v7a"/ s/include.*/include "arm64-v8a"/' \
              "$f" || true
          done

      # 11. Commit سورس داخل ریپازیتوری
      - name: Commit Telegram Source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== Git status ==="
          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Telegram source"
            git push
          fi

      # 12. نصب SDK و NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 13. بررسی فضای بعد از NDK
      - name: Check disk after NDK
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== ANDROID SDK SIZE ==="
          du -sh "$ANDROID_HOME" 2>/dev/null || true

          echo "=== NDK SIZE ==="
          du -sh "$ANDROID_HOME/ndk/27.2.12479018" 2>/dev/null || true

      # 14. Gradle تنظیمات
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 15. ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          ccache --max-size=2G

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 16. Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 17. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 18. فضای قبل Build
      - name: Check disk before build
        run: |
          echo "=== DISK BEFORE BUILD ==="
          df -h

          echo "=== GRADLE ==="
          du -sh ~/.gradle 2>/dev/null || true

          echo "=== CCACHE ==="
          du -sh ~/.ccache 2>/dev/null || true

      # 19. Gradle executable
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 20. Build
      - name: Build Telegram Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 21. پیدا کردن APK
      - name: Find APK
        if: success()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -exec ls -lh {} \;

      # 22. آپلود APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 23. فضای نهایی
      - name: Final disk usage
        if: always()
        run: |
          echo "=== FINAL DISK ==="
          df -h
