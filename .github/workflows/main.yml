name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # 1. آزاد کردن حداکثری فضای Runner
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 3072
          temp-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. نمایش فضای موجود
      - name: Show disk space
        run: |
          echo "=== Disk ==="
          df -h
          echo "=== Memory ==="
          free -h

      # 3. دریافت سورس Telegram
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          submodules: recursive
          fetch-depth: 1

      # 4. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. ساخت مسیر Android SDK
      - name: Prepare Android directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER:$USER" /usr/local/lib/android

      # 6. Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v4

      # 7. نصب NDK مورد نیاز Telegram
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 8. بررسی فضای بعد از نصب SDK/NDK
      - name: Check disk after Android setup
        run: |
          echo "=== Android SDK ==="
          du -sh "$ANDROID_HOME" 2>/dev/null || true

          echo "=== Disk ==="
          df -h

      # 9. فقط ARM64
      - name: Keep only arm64-v8a
        run: |
          echo "Patching ABI configuration..."

          grep -rlE "abiFilters|armeabi-v7a" \
            --include='build.gradle' \
            --include='*.gradle' \
            . 2>/dev/null |
          while read -r f; do
            echo "Patching $f"

            sed -i -E \
              '/abiFilters/ s/abiFilters.*/abiFilters "arm64-v8a"/' \
              "$f" || true

            sed -i -E \
              '/include +"armeabi-v7a"/ s/include.*/include "arm64-v8a"/' \
              "$f" || true
          done

          echo "=== ABI configuration ==="

          grep -rnE \
            "abiFilters|include +\"arm" \
            --include='*.gradle' \
            . 2>/dev/null || true

      # 10. Gradle configuration
      - name: Optimize Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 11. نصب ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          ccache --max-size=2G

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 12. Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 13. Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 14. بررسی فضای قبل از Build
      - name: Check disk before build
        run: |
          echo "=== Disk before build ==="
          df -h

          echo "=== Gradle ==="
          du -sh ~/.gradle 2>/dev/null || true

          echo "=== ccache ==="
          du -sh ~/.ccache 2>/dev/null || true

      # 15. Gradle executable
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 16. Build Telegram
      - name: Build Telegram Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 17. نمایش فضای بعد از Build
      - name: Disk usage after build
        if: always()
        run: |
          echo "=== Final disk ==="
          df -h

          echo "=== Largest directories ==="
          du -h -d 2 . 2>/dev/null | sort -hr | head -30 || true

      # 18. پیدا کردن APK
      - name: Find APK files
        if: success()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -exec ls -lh {} \;

      # 19. آپلود APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
