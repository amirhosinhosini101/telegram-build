name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:

      # 1. دریافت سورس
      - name: Checkout My Telegram Source
        uses: actions/checkout@v4
        with:
          repository: amirhosinhosini101/Telegram
          ref: master
          submodules: recursive
          fetch-depth: 1

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v4

      # 4. آزاد کردن فضا
      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get clean

          echo "=== AFTER CLEANUP ==="
          df -h

      # 5. بررسی سورس
      - name: Verify Telegram Source
        run: |
          set -e

          echo "Repository:"
          git remote -v

          echo "Current commit:"
          git rev-parse HEAD

          echo "Current branch:"
          git branch --show-current

          test -f gradlew || {
            echo "ERROR: gradlew not found!"
            exit 1
          }

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found!"
            exit 1
          }

          test -f TMessagesProj_Modules/media/core_settings.gradle || {
            echo "ERROR: TMessagesProj_Modules/media/core_settings.gradle NOT FOUND!"
            find TMessagesProj_Modules -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          }

          echo "SOURCE CHECK PASSED"

      # 6. نصب SDK و NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 7. بررسی فضا بعد از NDK
      - name: Check disk after NDK
        run: |
          df -h
          du -sh "$ANDROID_HOME" 2>/dev/null || true
          du -sh "$ANDROID_HOME/ndk/27.2.12479018" 2>/dev/null || true

      # 8. نگه داشتن فقط یک معماری (بر اساس matrix)
      - name: Keep only ${{ matrix.abi }}
        run: |
          grep -rlE "abiFilters|armeabi-v7a" \
            --include='*.gradle' \
            . 2>/dev/null |
          while read -r f; do
            echo "Patching: $f"

            sed -i -E \
              '/abiFilters/ s/abiFilters.*/abiFilters "${{ matrix.abi }}"/' \
              "$f" || true

            sed -i -E \
              '/include +"armeabi-v7a"/ s/include.*/include "${{ matrix.abi }}"/' \
              "$f" || true
          done

      # 9. تنظیمات Gradle
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 10. ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

          ccache --max-size=2G

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 11. Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.abi }}-

      # 12. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.abi }}-

      # 13. فضای قبل از Build
      - name: Check disk before build
        run: |
          df -h
          du -sh ~/.gradle 2>/dev/null || true
          du -sh ~/.ccache 2>/dev/null || true

      # 14. Gradle executable
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 15. Build
      - name: Build Telegram Debug APK (${{ matrix.abi }})
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 16. پیدا کردن APK
      - name: Find APK
        if: success()
        run: |
          find . -type f -name "*.apk" -exec ls -lh {} \;

      # 17. آپلود APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK-${{ matrix.abi }}
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 18. فضای نهایی
      - name: Final disk usage
        if: always()
        run: |
          df -h
